name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # CI: Runs on all PRs to main
  # ==========================================
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@epsilon-data'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      # Add more checks as needed:
      # - name: Type check
      #   run: npx tsc --noEmit
      # - name: Test
      #   run: npm run test
